name: Mumbai Local Automation Test

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test internet connectivity
        run: |
          echo "🚆 Mumbai Local Train Automation"
          echo "================================"
          echo "✅ GitHub Actions runner is working"
          echo "🌐 Testing internet connectivity..."
          curl -I --max-time 10 https://www.google.com
          echo "✅ Internet connectivity is working"
          echo "🕒 Current UTC time:"
          date -u
